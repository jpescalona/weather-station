location:
  latitude: 36.5396553
  longitude: -4.6267627
  altitude: 78

satellites:
  NOAA 15:
    frequency: 137620000
    norad_id: 25338
  NOAA 18:
    frequency: 137912500
    norad_id: 28654
  NOAA 19:
    frequency: 137100000
    norad_id: 33591

capture:
  rtl_sample_rate: 60000   # tuner bandwidth — wide enough for the ~34-40 kHz APT signal
  final_sample_rate: 11025  # output rate required by noaa-apt
  gain: 44.5                # dB — slightly higher for urban environment (Fuengirola)
  ppm: 0                    # frequency error correction; 0 for RTL-SDR V3
  min_elevation: 20
  pre_record_seconds: 30
  post_record_seconds: 30
  competing_services:
    - dump1090-fa

tle:
  file: "/tmp/weather-station/noaa_tle.txt"
  max_age_hours: 24

paths:
  recordings_dir: "/tmp/weather-station"
  log_file: "/home/pi/weather-station/logs/weather-station.log"

# Sensitive values are read from environment variables:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
telegram:
  bot_token:
  chat_id:

cleanup:
  delete_wav: true
  delete_png: true
